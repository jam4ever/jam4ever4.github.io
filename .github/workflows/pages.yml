name: Deploy income dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "lib/web_dashboard/**"
      - "data/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.4"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --target lib/web_dashboard/main.dart --base-href "/" --pwa-strategy=none
      - run: mkdir -p build/web/data && cp data/income.json build/web/data/income.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
